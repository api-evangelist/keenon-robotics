name: KEENON Robotics
description: 'KEENON Robotics is a global commercial service-robotics company founded in 2010 and
  headquartered in Shanghai, China, designing and manufacturing autonomous service robots deployed
  across more than 70 countries and 600+ cities. Its product lines span catering and delivery robots
  (the T-series and W3), the KLEENBOT commercial floor-cleaning range (C20/C30/C40/C55), heavy-load
  delivery robots (S100/S300), humanoid service robots (XMAN-R1/XMAN-F1), hospital and hotel logistics
  solutions (including the WITMED medical line), and the Keenmow K1 domestic robot. KEENON is a
  hardware-and-solutions company; as of this profile it publishes no public developer API, developer
  portal, or OpenAPI. This record is maintained in the API Evangelist network as a company profile.'
